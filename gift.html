

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookYourShow</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f5f5f5;
}

/* ================= HEADER ================= */
.head {
    width: 100%;
    background: white;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.logo h1 {
    font-size: 32px;
    font-family: cursive;
    color: black;
}

.logo span {
    color: red;
}

.logo a {
    text-decoration: none;
}

.search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 250px;
}

.search input {
    width: 100%;
    max-width: 600px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    outline: none;
}

.search_btn {
    padding: 12px 20px;
    border: none;
    background: #d81f26;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.search_btn:hover {
    background: red;
}

.right_head {
    display: flex;
    align-items: center;
    gap: 15px;
}

.drop select {
    border: none;
    background: transparent;
    font-size: 16px;
    cursor: pointer;
}

.sign_up {
    padding: 10px 20px;
    border: none;
    background: #d81f26;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.sign_up:hover {
    background: red;
}

.menu_icon {
    font-size: 25px;
    cursor: pointer;
}

/* ================= NAVBAR ================= */
.nav {
    background: #333;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
}

.nav_left,
.nav_right {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

.nav a {
    color: white;
    text-decoration: none;
}

.nav a:hover {
    color: red;
}

/* ================= BANNER ================= */
.banner {
    padding: 30px 5%;
}

.banner img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* ================= TITLE ================= */
.title {
    padding: 0 5%;
    font-size: 28px;
    margin: 10px 0;
}

/* ================= GRID ================= */
.grid {
    padding: 20px 5%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
}

.box {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: 0.3s;
}

.box:hover {
    transform: translateY(-5px);
}

.box img {
    width: 100%;
    height: 380px;
    object-fit: cover;
}

.rating {
    background: #111;
    text-align: center;
}

.rating h2 {
    color: white;
    padding: 10px;
    font-size: 14px;
}

.info {
    padding: 15px;
    text-align: center;
}

.info h3 {
    margin-bottom: 8px;
}

/* ================= ABOUT ================= */
.about {
    padding: 60px 150px;
    text-align: center;
}

.about h1 {
    font-size: 42px;
    color: #d81f26;
    margin-bottom: 30px;
    font-family: cursive;
}

.about p {
    font-size: 18px;
    color: #444;
    line-height: 1.8;
    margin-bottom: 20px;
    text-align: justify;
}

.name {
    color: #d81f26;
    font-weight: bold;
    font-family: cursive;
}

/* ================= FOOTER ================= */
.footer {
    margin-top: 30px;
    background: gray;
    color: white;
    text-align: center;
    padding: 18px;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 1200px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
    .about { padding: 50px 100px; }
}

@media (max-width: 992px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .banner img { height: 240px; }
    .about { padding: 40px 60px; }
    .about h1 { font-size: 36px; }
}

@media (max-width: 768px) {
    .head {
        flex-direction: column;
        align-items: stretch;
    }

    .nav {
        flex-direction: column;
    }

    .grid { grid-template-columns: repeat(2, 1fr); }

    .banner img { height: 200px; }

    .about {
        padding: 30px 25px;
    }

    .about h1 {
        font-size: 30px;
    }

    .about p {
        font-size: 16px;
        text-align: left;
    }
}

@media (max-width: 480px) {
    .logo h1 {
        font-size: 26px;
        text-align: center;
    }

    .search {
        flex-direction: column;
    }

    .search_btn {
        width: 100%;
    }

    .grid { grid-template-columns: 1fr; }

    .about {
        padding: 25px 15px;
    }

    .about h1 {
        font-size: 26px;
    }

    .about p {
        font-size: 15px;
        line-height: 1.6;
    }
}
/* ================= GIFT CARDS ================= */
.about ul{
    list-style: none;
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 0;
}

.about ul li{
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    font-size: 16px;
    color: #333;
    text-align: center;
    transition: 0.3s;
    border-left: 5px solid #d81f26;
}

.about ul li:hover{
    transform: translateY(-5px);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 992px){
    .about ul{
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px){
    .about ul{
        grid-template-columns: 1fr;
    }

    .about ul li{
        font-size: 15px;
        padding: 16px;
    }
}
</style>
</head>

<body>

<div class="head">
    <div class="logo">
        <a href="index.html"><h1>Book<span>your</span>Show</h1></a>
    </div>

    <div class="search">
        <input type="text" placeholder="Search for movies, series....">
        <button class="search_btn">Search</button>
    </div>

    <div class="right_head">
        <div class="drop">
            <select>
                <option>BLR</option>
                <option>Chennai</option>
                <option>Hyderabad</option>
            </select>
        </div>

        <button class="sign_up">Sign In</button>
        <div class="menu_icon"><i class="fa-solid fa-bars"></i></div>
    </div>
</div>

<div class="nav">
    <div class="nav_left">
        <a href="index.html#movie">Movies</a>
        <a href="index.html#series">Series</a>
        <a href="index.html#events">Events</a>
        <a href="about.html">About</a>
    </div>

    <div class="nav_right">
        <a href="index.html#list">Your List</a>
        <a href="index.html#offers">Offers</a>
        <a href="gift.html">Gifts</a>
    </div>
</div>

    <div class="about">
        <h1> Gift Cards</h1>
        <ul>
            <li>Gift Card : $25 Code: GIFT25</li>
            <li>Gift Card : $50 Code: GIFT50</li>
            <li>Gift Card : $70 Code: GIFT70</li>
        </ul>

    </div>

<div class="banner">
    <img src="banner3.jpg" alt="Banner">
</div>

<div class="footer">
    <p>© 2026 BookYourShow. All Rights Reserved.</p>
</div>

</body>
</html>
